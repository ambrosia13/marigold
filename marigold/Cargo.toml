[package]
name = "marigold"
version = "0.1.0"
edition = "2024"

[build-dependencies]
regex = "1.13.1"
chrono = "0.4.45"
rayon.workspace = true

[dependencies]
# rendering
vulkano.workspace = true
winit.workspace = true

# user interface
egui.workspace = true
egui-winit.workspace = true

# game engine stuff
bevy_ecs = { workspace = true, features = ["debug"] }
glam.workspace = true
gltf.workspace = true

# logging
env_logger.workspace = true
log.workspace = true

# general utility
anyhow.workspace = true
derived-deref.workspace = true
rayon.workspace = true
itertools.workspace = true

# data manipulation
bytemuck.workspace = true

# noise & random
rand.workspace = true

# workspace dependencies
bvh = { path = "../bvh" }
mesh_interface = { path = "../mesh_interface" }
gltf_loading = { path = "../gltf_loading" }
