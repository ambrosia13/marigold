[package]
name = "bvh"
version = "0.1.0"
edition = "2024"

[dependencies]
# game engine stuff
glam = { version = "0.33.3", features = ["bytemuck"] }

# logging
log.workspace = true

# general utility
rayon.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# data manipulation
bytemuck.workspace = true

# noise & random
rand = "0.10.2"
